name: Bug report
description: Report a reproducible problem in Nomyr.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first. Remove credentials, personal data, customer data, and private infrastructure details from all evidence.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI
        - API or server
        - Web interface
        - OpenAPI, protobuf, or JSON Schema contract
        - Connector or action SDK
        - Build or CI
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run …
        2. Configure …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or additional context
      description: Include environment details and sanitized output. Never include secrets or private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, personal data, customer data, and private infrastructure details.
          required: true
