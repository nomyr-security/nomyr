name: development Compose smoke

on:
  pull_request:
    paths:
      - .github/workflows/dev-compose.yml
      - deploy/compose/compose.yaml
      - tools/dev/stack
      - tools/dev/stack_test.sh
      - Makefile
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-compose.yml
      - deploy/compose/compose.yaml
      - tools/dev/stack
      - tools/dev/stack_test.sh
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Compose service health
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate config and check service health
        env:
          NOMYR_DEV_ENV_FILE: ${{ runner.temp }}/nomyr-dev-compose.env
        run: |
          make dev-stack-config
          make dev-smoke
      - name: Install checksum-pinned Grype
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grype" reports/image-scan
          archive="$RUNNER_TEMP/grype/grype_0.121.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz \
            --output "$archive"
          echo '64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/grype" grype
          "$RUNNER_TEMP/grype/grype" version | tee reports/image-scan/grype-version.txt
      - name: Scan Compose and devcontainer images from public registries
        shell: bash
        env:
          NOMYR_DEV_ENV_FILE: ${{ runner.temp }}/nomyr-dev-compose.env
        run: |
          set +e
          report_dir=reports/image-scan
          mkdir -p "$report_dir/images"
          image_list="$RUNNER_TEMP/nomyr-image-refs.txt"
          docker compose --env-file "$NOMYR_DEV_ENV_FILE" -f deploy/compose/compose.yaml config --images > "$image_list"
          config_status=$?
          if [ "$config_status" -ne 0 ]; then
            printf 'Compose image inventory failed (exit %s)\n' "$config_status" | tee "$report_dir/scan-errors.txt"
          fi
          jq -r '.image' .devcontainer/devcontainer.json >> "$image_list"
          scan_status=0
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            safe_name=$(printf '%s' "$image" | tr '/:@' '___')
            report="$report_dir/images/$safe_name.json"
            printf '%s\n' "$image" > "$report_dir/images/$safe_name.source"
            "$RUNNER_TEMP/grype/grype" "registry:$image" --fail-on high --output json --file "$report"
            result=$?
            if [ "$result" -eq 2 ]; then
              printf '%s: High/Critical vulnerability threshold exceeded\n' "$image" >> "$report_dir/scan-summary.txt"
              scan_status=2
            elif [ "$result" -ne 0 ]; then
              printf '%s: scanner failed with exit %s\n' "$image" "$result" >> "$report_dir/scan-errors.txt"
              scan_status=1
            fi
            if [ -s "$report" ]; then
              jq -r --arg image "$image" '[.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")] | "\($image): \(length) High/Critical matches; complete findings in JSON report"' "$report" >> "$report_dir/scan-summary.txt"
              jq -r --arg image "$image" '.matches[] | [.vulnerability.severity, (.vulnerability.fix.state // "unknown"), (.vulnerability.fix.versions // [] | join(",")), .vulnerability.id, .artifact.name, .artifact.version] | @tsv' "$report" | sort -u >> "$report_dir/findings.tsv"
            fi
          done < "$image_list"
          if [ "$config_status" -ne 0 ]; then
            exit 1
          fi
          exit "$scan_status"
      - name: Upload complete Grype reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: dev-image-grype-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/image-scan/
          if-no-files-found: warn
          retention-days: 14
      - name: Always tear down containers, volumes, and temporary credentials
        if: always()
        env:
          NOMYR_DEV_ENV_FILE: ${{ runner.temp }}/nomyr-dev-compose.env
        run: |
          set +e
          if [ -f "$NOMYR_DEV_ENV_FILE" ]; then
            tools/dev/stack reset
            status=$?
          else
            status=0
          fi
          rm -f "$NOMYR_DEV_ENV_FILE"
          exit "$status"
