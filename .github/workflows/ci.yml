name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: make test-fast
      - run: make build

  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate title
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request titles must follow Conventional Commits."
            echo "Example: fix(cli): reject non-loopback demo addresses"
            exit 1
          fi
      - name: Confirm non-PR run
        if: github.event_name != 'pull_request'
        run: echo "Pull request title validation runs for pull request events."
