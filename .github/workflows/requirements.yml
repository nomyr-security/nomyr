name: requirement-status

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Validate and summarize requirements
        run: go run ./tools/requirements >> "$GITHUB_STEP_SUMMARY"
      - name: Test requirement tracker
        run: go test ./tools/requirements/...
