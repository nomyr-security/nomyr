name: contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Lint, compatibility, and generation drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"
      - name: Install pinned contract tools
        run: |
          set -a
          source tools/contracts/versions.env
          set +a
          go install "github.com/bufbuild/buf/cmd/buf@$BUF_VERSION"
          go install "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}"
          go install "github.com/daveshanley/vacuum@$VACUUM_VERSION"
          python -m pip install --only-binary=:all: --require-hashes --requirement tools/contracts/requirements.txt
      - name: Buf lint and breaking check
        run: |
          buf lint proto
          buf breaking proto --against '.git#branch=origin/main,subdir=proto'
      - name: OpenAPI lint and breaking check
        run: |
          vacuum lint api/openapi/v1.yaml
          git show origin/main:api/openapi/v1.yaml > "$RUNNER_TEMP/openapi-main.yaml"
          oasdiff breaking "$RUNNER_TEMP/openapi-main.yaml" api/openapi/v1.yaml
      - name: JSON Schema validation and fixtures
        run: python tools/contracts/validate-json-schemas.py
      - name: Generated output drift
        run: tools/contracts/generate.sh --check
