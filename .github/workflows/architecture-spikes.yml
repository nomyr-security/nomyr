name: Architecture spikes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike-tests:
    name: Isolated architecture evidence
    runs-on: ubuntu-latest
    env:
      NOMYR_SPIKE_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/nomyr_spikes?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build static export and Go binaries
        run: |
          make build
      - name: Start loopback-only PostgreSQL service
        run: |
          image='postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5'
          docker pull "$image"
          docker run --detach --name nomyr-spike-postgres --publish 127.0.0.1:5432:5432 --env POSTGRES_HOST_AUTH_METHOD=trust --env POSTGRES_DB=nomyr_spikes "$image"
          for attempt in $(seq 1 30); do
            if docker exec nomyr-spike-postgres pg_isready -U postgres -d nomyr_spikes; then exit 0; fi
            sleep 1
          done
          docker logs nomyr-spike-postgres
          exit 1
      - name: Verify compiler and isolated module graph
        working-directory: tools/spikes
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.10"
          go vet ./...
          go mod verify
          govulncheck -version
          govulncheck -test ./...
      - name: Run isolated SDK, database, and messaging evidence
        run: go test -count=1 -v ./...
        working-directory: tools/spikes
      - name: Stop loopback-only PostgreSQL service
        if: always()
        run: docker rm --force nomyr-spike-postgres || true
