name: Architecture spikes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike-tests:
    name: Isolated architecture evidence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nomyr_spikes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nomyr_spikes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NOMYR_SPIKE_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/nomyr_spikes?sslmode=disable
      NOMYR_SPIKE_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Build static export and Go binaries
        run: |
          npm ci --ignore-scripts
          make build
      - name: Start pinned local JetStream service
        run: |
          image='nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde'
          docker pull "$image"
          docker run --detach --name nomyr-spike-nats --publish 127.0.0.1:4222:4222 --publish 127.0.0.1:8222:8222 "$image" -js -m 8222
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs nomyr-spike-nats
          exit 1
      - name: Verify compiler and isolated module graph
        working-directory: tools/spikes
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.10"
          go vet ./...
          go mod verify
          govulncheck -version
          govulncheck ./...
      - name: Run isolated SDK, database, and messaging evidence
        run: go test -count=1 -v ./...
        working-directory: tools/spikes
      - name: Stop local JetStream service
        if: always()
        run: docker rm --force nomyr-spike-nats || true
